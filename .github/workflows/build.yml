# PiliNara Z/X/C 倍速快捷键 —— GitHub Actions 自动构建
# 复刻 run.ps1 的完整流程：拉取官方最新源码 -> 应用补丁 -> 编译 Windows exe -> 上传产物
# 仅手动触发：Actions 页面点 Run workflow 即可构建最新版。

name: Build PiliNara (Z/X/C hotkey)

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: 发布到 GitHub Release（nightly 预发布，覆盖上次）
        required: false
        default: false
        type: boolean


jobs:
  build-windows:
    name: Build Windows x64 exe
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout patch repo
        uses: actions/checkout@v4

      - name: Clone official PiliNara source
        shell: pwsh
        run: |
          git clone -q --depth 1 https://github.com/Starfallan/PiliNara.git PiliNara-source
          if ($LASTEXITCODE -ne 0) { throw "克隆官方源码失败" }

      - name: Apply Z/X/C speed hotkey patch
        shell: pwsh
        working-directory: PiliNara-source
        run: |
          $ErrorActionPreference = 'Continue'
          $patch = "$env:GITHUB_WORKSPACE/pilinara_zxc_speed_hotkey.patch"
          if (-not (Test-Path -LiteralPath $patch)) { throw "找不到补丁文件: $patch" }
          $applied = $false
          try {
            git apply --check $patch 2>$null
            if ($LASTEXITCODE -eq 0) {
              git apply $patch 2>$null
              if ($LASTEXITCODE -eq 0) { $applied = $true }
            }
          } catch { }
          if (-not $applied) {
            Write-Host "git apply 未成功（官方可能改过这 3 个文件），改用直接覆盖..."
            $files = @(
              'lib/pages/video/widgets/player_focus.dart',
              'lib/plugin/pl_player/controller.dart',
              'lib/plugin/pl_player/view/view.dart'
            )
            foreach ($f in $files) {
              Copy-Item "$env:GITHUB_WORKSPACE/files/$f" $f -Force
              Write-Host "  已覆盖 $f"
            }
          }
          Write-Host "[OK] 补丁已应用"
          exit 0

      - name: Setup Flutter (自动读取官方 pubspec.yaml 要求的版本)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: PiliNara-source/pubspec.yaml
          cache: true

      - name: Apply official SDK patches (与官方 CI 一致，直接跑 patch.ps1)
        shell: pwsh
        working-directory: PiliNara-source
        run: |
          $env:FLUTTER_ROOT = Split-Path -Parent (Split-Path -Parent (Get-Command flutter).Source)
          $env:GITHUB_WORKSPACE = (Get-Location).Path
          & powershell -NoProfile -ExecutionPolicy Bypass -File 'lib\scripts\patch.ps1' windows
          if ($LASTEXITCODE -ne 0) { throw "官方 SDK 补丁应用失败" }
          Write-Host "[OK] 官方 SDK 补丁已应用"

      - name: Generate release config (pili_release.json)
        shell: pwsh
        working-directory: PiliNara-source
        run: |
          & powershell -NoProfile -ExecutionPolicy Bypass -File 'lib\scripts\build.ps1'
          if ($LASTEXITCODE -ne 0) { throw "生成 release 配置失败" }
          Write-Host "  版本: $env:version"

      - name: Adapt windows CMakeLists (remove /WX, local install prefix)
        shell: pwsh
        working-directory: PiliNara-source
        run: |
          $cmakeFile = 'windows\CMakeLists.txt'
          if (-not (Test-Path -LiteralPath $cmakeFile)) { Write-Host "跳过: 无 CMakeLists"; exit 0 }
          $cmakeContent = [System.IO.File]::ReadAllText($cmakeFile)
          $changed = $false
          if ($cmakeContent -match '/WX') { $cmakeContent = $cmakeContent -replace '/WX', ''; $changed = $true }
          if ($cmakeContent -notmatch 'CMAKE_INSTALL_PREFIX') {
            $nl = if ($cmakeContent.Contains([string][char]13)) { [string][char]13 + [string][char]10 } else { [string][char]10 }
            $prefixLine = 'set(CMAKE_INSTALL_PREFIX "${CMAKE_CURRENT_SOURCE_DIR}/build/install" CACHE STRING "" FORCE)'
            $cmakeContent = $prefixLine + $nl + $cmakeContent
            $changed = $true
          }
          if ($changed) {
            [System.IO.File]::WriteAllText($cmakeFile, $cmakeContent, (New-Object System.Text.UTF8Encoding($false)))
            Write-Host "  已适配 windows\CMakeLists.txt"
          }

      - name: Build Windows release
        shell: pwsh
        working-directory: PiliNara-source
        run: |
          flutter build windows --release --dart-define-from-file=pili_release.json
          if ($LASTEXITCODE -ne 0) { throw "编译失败（请确认 windows-latest 已含 VS C++ 工具链）" }

      - name: Package release dir + zip
        shell: pwsh
        run: |
          $releaseDir = 'PiliNara-source\build\windows\x64\runner\Release'
          if (-not (Test-Path -LiteralPath (Join-Path $releaseDir 'pilinara.exe'))) {
            throw "编译产物未找到: $releaseDir\pilinara.exe"
          }
          New-Item -ItemType Directory -Force -Path 'release' | Out-Null
          Copy-Item -Path (Join-Path $releaseDir '*') -Destination 'release' -Recurse -Force
          if (-not $env:version) { $env:version = (Get-Date -Format 'yyyyMMddHHmmss') }
          Compress-Archive -Path 'release\*' -DestinationPath "pilinara_zxc_$env:version.zip"
          Write-Host "已生成: pilinara_zxc_$env:version.zip"
          Write-Host "exe: $((Get-Item 'release\pilinara.exe').FullName)"

      - name: Upload portable zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: pilinara_zxc_windows_x64
          path: pilinara_zxc_*.zip
          if-no-files-found: error

      - name: Publish nightly GitHub Release
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.create_release == 'true') || github.event_name == 'schedule' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete nightly --yes --cleanup-tag 2>$null | Out-Null
          gh release create nightly "pilinara_zxc_*.zip" --title "PiliNara (Z/X/C speed hotkey) nightly" --prerelease --notes "自动构建的 Windows 便携版，内置 Z/X/C 倍速快捷键。解压后运行 pilinara.exe 即可。"
          Write-Host "已发布 nightly release"
